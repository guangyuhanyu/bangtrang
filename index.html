<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bảng trắng Guangyu Hanyu</title>
<style>
:root{
  --ink:#2b2b2b; --red:#b7312c; --paper:#fbf7ee; --line:#e6dfcf; --muted:#8a8172;
  --bar:rgba(255,253,248,.95);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#bg{position:fixed;inset:0;background:var(--paper)}
#bg.w{background:#fff}
#bg.tian{background-color:var(--paper);background-image:var(--tian);background-size:120px 120px;background-position:40px 100px}
.frm{position:absolute;pointer-events:none;display:none}
#bg.cp .frm{display:block}
.frm.b1{inset:14px;border:1.2px solid rgba(183,49,44,.28)}
.frm.b2{inset:22px;border:.8px solid rgba(183,49,44,.2)}
.frm.cn{width:56px;height:56px;opacity:.22}
.frm.cloud{opacity:.14}
#wm{position:fixed;right:70px;bottom:62px;display:flex;flex-direction:column;align-items:center;opacity:.14;pointer-events:none}
#wm img{width:120px;height:auto}
#wm div{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-weight:600;font-size:17px;letter-spacing:3px;color:var(--red);margin-top:6px;white-space:nowrap}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#live{touch-action:none;cursor:crosshair}
/* toolbar */
#bar{position:fixed;left:50%;top:14px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:6px 8px;box-shadow:0 4px 18px rgba(80,50,20,.10);z-index:10;transition:transform .2s,opacity .2s}
#bar.hide{transform:translate(-50%,-120%);opacity:0;pointer-events:none}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:44px;height:46px;padding:0 4px;border:0;background:none;border-radius:9px;cursor:pointer;color:#4a4339;font:inherit}
.tb:hover{background:#f4eee2}
.tb.on{background:#f7e3df;color:var(--red)}
.tb b{font-size:18px;font-weight:500;line-height:1.1;font-family:"Kaiti SC","STKaiti","Songti SC","Noto Serif CJK SC",serif}
.tb i{font-style:normal;font-size:10px;color:#9b9284;border:1px solid #ddd5c5;border-radius:4px;padding:0 4px;margin-top:3px;line-height:14px}
.tb.on i{border-color:#e7b9b3;color:#c0605a}
.sep{width:1px;height:30px;background:var(--line);margin:0 3px}
#cols{display:flex;gap:7px;padding:0 4px}
.cdot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cfc6b5;cursor:pointer;position:relative}
.cdot.on{box-shadow:0 0 0 2px #3b352c}
.cdot span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:9.5px;color:#9b9284}
.cdot.hl{border-radius:5px;width:26px;height:18px;margin-top:2px}
#szv{width:30px;height:30px;display:flex;align-items:center;justify-content:center}
#szv span{display:block;border-radius:50%;background:var(--ink)}
/* bottom */
#pager.hide,#saved.hide{opacity:0;transform:translate(-50%,140%);pointer-events:none}
#saved.hide{transform:none}
#pager{transition:transform .2s,opacity .2s;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:var(--bar);border:1px solid var(--line);border-radius:20px;padding:3px 6px;font-size:13px;color:#6f675a;z-index:10}
#pager button{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:3px 8px;border-radius:12px}
#pager button:hover{background:#f1eadc}
#pinfo{min-width:84px;text-align:center}
#saved{position:fixed;left:30px;bottom:20px;font-size:12px;color:#6c9a6f;z-index:10;pointer-events:none}
#saved.err{color:#c0392b}
#close{position:fixed;right:16px;top:14px;z-index:20;display:none;align-items:center;gap:6px;border:1px solid #e3c3bd;background:#fff8f6;color:var(--red);border-radius:12px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;box-shadow:0 3px 12px rgba(120,40,30,.12)}
#close b{font-size:18px;line-height:1}
#close i{font-style:normal;font-size:10px;border:1px solid #e7b9b3;border-radius:4px;padding:0 4px}
body.ov #close{display:flex}
/* editor */
#ed{position:fixed;min-width:40px;min-height:1em;padding:0 2px;outline:1.5px dashed rgba(183,49,44,.55);outline-offset:4px;white-space:pre-wrap;z-index:12;display:none;-webkit-user-select:text;user-select:text;line-height:1.15;caret-color:var(--red)}
#imebox{position:fixed;z-index:13;display:none;background:#fffdf8;border:1px solid #e0d6c3;border-radius:10px;box-shadow:0 6px 22px rgba(70,40,10,.16);padding:6px 8px;font-size:15px;max-width:92vw}
#imebuf{color:#7a6f5d;font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px;padding:0 4px 4px;border-bottom:1px solid #efe7d8;margin-bottom:4px;display:flex;justify-content:space-between;gap:16px}
#imebuf small{color:#b2a892}
#imelist{display:flex;gap:2px;flex-wrap:nowrap}
.cand{padding:3px 8px;border-radius:7px;cursor:pointer;white-space:nowrap;font-size:22px;font-family:"PingFang SC","Heiti SC","Noto Sans CJK SC",sans-serif}
.cand small{font-size:11px;color:#a59b88;margin-right:3px;font-family:Arial}
.cand.f{background:#f7e3df;color:var(--red)}
.cand:hover{background:#f3ecdf}
#imemode{position:fixed;z-index:13;display:none;font-size:12px;background:var(--red);color:#fff;border-radius:6px;padding:1px 6px;cursor:pointer}
#imemode.en{background:#7d7466}
/* panels */
#help{position:fixed;inset:0;background:rgba(40,30,20,.35);z-index:40;display:none;align-items:center;justify-content:center}
#help.show{display:flex}
#hp{background:#fffdf8;border-radius:16px;width:min(880px,94vw);max-height:90vh;overflow:auto;padding:22px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25);-webkit-user-select:text;user-select:text}
#hp h2{margin:0 0 4px;font-size:20px;color:var(--red);font-family:"Songti SC","Noto Serif CJK SC",serif}
#hp h3{margin:18px 0 8px;font-size:15px;color:#5b4e3a}
#hp .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 18px;font-size:13.5px}
#hp .grid div{display:flex;gap:8px;align-items:baseline;padding:2px 0;border-bottom:1px dotted #eee5d4}
kbd{display:inline-block;min-width:22px;text-align:center;font-family:"Helvetica Neue",Arial,sans-serif;font-size:11.5px;background:#f6f0e4;border:1px solid #dcd2bf;border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:#4b4235;white-space:nowrap}
#hp p,#hp li{font-size:13.5px;line-height:1.6}
#hp .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{border:1px solid #dccfb8;background:#fff;border-radius:9px;padding:7px 12px;font:inherit;font-size:13.5px;cursor:pointer;color:#4a4032}
.btn:hover{background:#f7f0e3}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
#bm{display:inline-block;background:var(--red);color:#fff;text-decoration:none;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px}
#bmcode{width:100%;height:70px;font-size:11px;font-family:Menlo,monospace;border:1px solid #e0d6c3;border-radius:8px;padding:6px;margin-top:6px;background:#faf6ee}
#szpop{position:fixed;z-index:15;display:none;background:var(--bar);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 6px 20px rgba(80,50,20,.14);gap:4px}
#szpop.show{display:flex}
.szo{width:46px;height:52px;border:0;background:none;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:inherit;font-size:10.5px;color:#8a8172}
.szo:hover{background:#f4eee2}.szo.on{background:#f7e3df;color:var(--red)}
.szo span{display:block;border-radius:50%}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:rgba(43,43,43,.86);color:#fff;border-radius:10px;padding:7px 14px;font-size:13.5px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>

<script>

/* ---------- constants ---------- */

const TOOLS=[['pen','✎','P','Bút'],['hl','▬','H','Bút highlight'],['er','⌫','E','Tẩy'],['laser','◉','L','Bút laser (tự mờ)'],['tx','文','T','Gõ chữ Hán'],['gr','田','G','Chèn ô 田/米字格 (bấm G lần nữa để đổi)'],['sel','⬚','V','Chọn / di chuyển']];
const tianSvg=c=>`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><rect x='.5' y='.5' width='119' height='119' fill='none' stroke='${c}' stroke-opacity='.28' stroke-width='1'/><path d='M60 0V120M0 60H120' stroke='${c}' stroke-opacity='.22' stroke-dasharray='5 5'/></svg>`)}")`;
document.documentElement.style.setProperty('--tian',tianSvg('#b7312c'));

/* ---------- state ---------- */
let S={tool:'pen',pen:0,hl:0,si:{pen:1,hl:1,er:1,tx:2,gr:2},py:true,font:'kai',gk:'tian',ime:'zh',bar:true,ah:false,learn:{}};
let D={pages:[newPage()],cur:0};
function newPage(bg){return {id:uid(),bg:bg||'cp',objs:[]};}
function uid(){return Math.random().toString(36).slice(2,10);}
const page=()=>D.pages[D.cur];
const hist={}; const H=()=>hist[page().id]||(hist[page().id]={u:[],r:[]});
function commit(objs){const h=H();h.u.push(page().objs);if(h.u.length>80)h.u.shift();h.r=[];page().objs=objs;render();save();}
function undo(){const h=H();if(!h.u.length)return toast('Không còn gì để hoàn tác');h.r.push(page().objs);page().objs=h.u.pop();sel.clear();render();save();}
function redo(){const h=H();if(!h.r.length)return;h.u.push(page().objs);page().objs=h.r.pop();sel.clear();render();save();}

/* ---------- storage (IndexedDB, fallback localStorage) ---------- */
const DB={db:null,
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('gy-board',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res();};r.onerror=()=>rej(r.error);}catch(e){rej(e);}});},
  get(k){return new Promise((res,rej)=>{if(!this.db)return rej('nodb');const t=this.db.transaction('kv','readonly').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});},
  set(k,v){return new Promise((res,rej)=>{if(!this.db)return rej('nodb');const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
};
let saveT=null;
function save(now){clearTimeout(saveT);setSaved('…');saveT=setTimeout(doSave,now?0:500);}
async function doSave(){
  const data={pages:D.pages,cur:D.cur,v:1};
  try{await DB.set('data',data);await DB.set('settings',S);setSaved('ok');}
  catch(e){try{localStorage.setItem('gy-board',JSON.stringify(data));localStorage.setItem('gy-set',JSON.stringify(S));setSaved('ok');}catch(e2){setSaved('err');}}
}
function setSaved(s){const el=$('#saved');el.className=s==='err'?'err':'';el.textContent=s==='ok'?'● Đã tự lưu':s==='err'?'⚠ Chưa lưu được – hãy Xuất sao lưu':'○ Đang lưu…';}
async function load(){
  let data=null,set=null;
  try{await DB.open();data=await DB.get('data');set=await DB.get('settings');}catch(e){}
  if(!data){try{data=JSON.parse(localStorage.getItem('gy-board'));set=set||JSON.parse(localStorage.getItem('gy-set'));}catch(e){}}
  if(data&&data.pages&&data.pages.length){D={pages:data.pages,cur:Math.min(data.cur||0,data.pages.length-1)};D.pages.forEach(p=>{p.id=p.id||uid();p.bg=p.bg||'cp';p.objs=p.objs||[];});}
  if(set){S=Object.assign(S,set);S.si=Object.assign({pen:1,hl:1,er:1,tx:2,gr:2},set.si||{});S.learn=set.learn||{};}
}
addEventListener('pagehide',()=>doSave());
document.addEventListener('visibilitychange',()=>{if(document.hidden)doSave();});

/* ---------- canvases ---------- */
const cv=$('#cv'),lv=$('#live'),cx=cv.getContext('2d'),lx=lv.getContext('2d');
let W=0,Hh=0,dpr=1;
let RC={left:0,top:0,width:1,height:1};
function resize(){const r=lv.getBoundingClientRect();RC={left:r.left,top:r.top,width:r.width||innerWidth,height:r.height||innerHeight};
  dpr=Math.max(1,window.devicePixelRatio||1);W=RC.width;Hh=RC.height;
  for(const c of [cv,lv]){c.width=Math.round(W*dpr);c.height=Math.round(Hh*dpr);}
  render();liveDirty();}
function checkSize(){const r=lv.getBoundingClientRect();if(Math.abs(r.width-W)>.5||Math.abs(r.height-Hh)>.5||Math.abs(r.left-RC.left)>.5||Math.abs(r.top-RC.top)>.5||(window.devicePixelRatio||1)!==dpr)resize();}
function resizeSoon(){resize();[60,200,500,1000].forEach(ms=>setTimeout(checkSize,ms));}
addEventListener('resize',resizeSoon);
document.addEventListener('fullscreenchange',resizeSoon);document.addEventListener('webkitfullscreenchange',resizeSoon);
if(window.visualViewport)visualViewport.addEventListener('resize',resizeSoon);
if(window.ResizeObserver)new ResizeObserver(()=>checkSize()).observe(lv);
setInterval(checkSize,1500);
const toB=(X,Y)=>({x:(X-RC.left)*(W/RC.width),y:(Y-RC.top)*(Hh/RC.height)});

/* ---------- geometry helpers ---------- */
const bbCache=new WeakMap();
function bbox(o){
  if(bbCache.has(o))return bbCache.get(o);
  let b;
  if(o.t==='s'){let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;const p=o.p;for(let i=0;i<p.length;i+=3){if(p[i]<x1)x1=p[i];if(p[i]>x2)x2=p[i];if(p[i+1]<y1)y1=p[i+1];if(p[i+1]>y2)y2=p[i+1];}const m=o.w/2+2;b={x:x1-m,y:y1-m,w:x2-x1+2*m,h:y2-y1+2*m};}

/* ---------- drawing ---------- */
const imgCache=new Map();

/* ---------- stroke building ---------- */
function densify(p,step){const out=[p[0],p[1],p[2]];for(let i=3;i<p.length;i+=3){const ax=out[out.length-3],ay=out[out.length-2],ap=out[out.length-1],bx=p[i],by=p[i+1],bp=p[i+2];const d=Math.hypot(bx-ax,by-ay),k=Math.floor(d/step);for(let j=1;j<k;j++){const t=j/k;out.push(ax+(bx-ax)*t,ay+(by-ay)*t,ap+(bp-ap)*t);}out.push(bx,by,bp);}return out;}

/* ---------- eraser ---------- */
function eraseAt(objs,x,y,r){

    if(o.t==='x'||o.t==='g'){changed=true;continue;}

ed.addEventListener('keydown',e=>{
  e.stopPropagation();

  if(e.key==='Shift'){shiftAlone=true;return;}shiftAlone=false;
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key==='Enter'){e.preventDefault();commitEdit();return;}
  if(mod)return;
  if(e.key==='Escape'){e.preventDefault();if(buf){buf='';updIME();}else commitEdit();return;}
  if(S.ime!=='zh'){return;}

    if(/^[a-zA-Z']$/.test(e.key)&&!(e.shiftKey&&/[A-Z]/.test(e.key))){e.preventDefault();buf+=e.key.toLowerCase();cpage=0;updIME();return;}
    if(e.key==='Backspace'){e.preventDefault();buf=buf.slice(0,-1);cpage=0;updIME();return;}
    if(e.key===' '){e.preventDefault();pick(cpage*9);return;}
    if(/^[1-9]$/.test(e.key)){e.preventDefault();pick(cpage*9+(+e.key-1));return;}
    if(e.key==='Enter'){e.preventDefault();const b=buf;buf='';updIME();insertText(b);return;}
    if(e.key==='='||e.key==='.'||e.key==='PageDown'||e.key==='ArrowDown'){e.preventDefault();if((cpage+1)*9<cands.length){cpage++;drawCands();}return;}
    if(e.key==='-'||e.key===','||e.key==='PageUp'||e.key==='ArrowUp'){e.preventDefault();if(cpage>0){cpage--;drawCands();}return;}
    if(e.key.length===1){e.preventDefault();return;}
    return;
  }
  if(/^[a-z]$/.test(e.key)){e.preventDefault();buf=e.key;cpage=0;updIME();return;}
  if(e.key==='Enter'){e.preventDefault();document.execCommand('insertLineBreak');posMode();return;}
  if(e.key==='"'){e.preventDefault();insertText(quoteOpen.d?'”':'“');quoteOpen.d=!quoteOpen.d;return;}
  if(e.key==="'"){e.preventDefault();insertText(quoteOpen.s?'’':'‘');quoteOpen.s=!quoteOpen.s;return;}
  if(PUNC[e.key]){e.preventDefault();insertText(PUNC[e.key]);return;}
});

/* IME dictionary */
const CH=new Map(),WD=new Map(),INI=new Map(),SYL=[],RANK=new Map();
(function(){
  IME_C.split('|').forEach(s=>{const i=s.indexOf(':');const k=s.slice(0,i),v=[...s.slice(i+1)];CH.set(k,v);SYL.push(k);});
  let r=0;const seen=new Set();
  IME_W.split('|').forEach(s=>{const i=s.indexOf(':');const k=s.slice(0,i),v=s.slice(i+1).split(',');WD.set(k,v);
    const ini=k.split("'").map(x=>x[0]).join('');if(!INI.has(ini))INI.set(ini,[]);const a=INI.get(ini);v.forEach(w=>a.push([w,k]));});
  SYL.sort((a,b)=>b.length-a.length);
})();
const SYLSET=new Set(CH.keys());
function segment(s){ // returns array of syllables (last may be partial) or null
  s=s.replace(/'+/g,"'");const parts=s.split("'").filter(Boolean);const out=[];
  for(let pi=0;pi<parts.length;pi++){const r=seg1(parts[pi],pi===parts.length-1);if(!r)return null;out.push(...r);}
  return out;
}
function seg1(s,allowPartial){
  const memo=new Map();
  function f(i){if(i===s.length)return [];if(memo.has(i))return memo.get(i);let res=null;
    for(let L=Math.min(6,s.length-i);L>=1;L--){const sub=s.substr(i,L);if(SYLSET.has(sub)){const rest=f(i+L);if(rest){res=[sub].concat(rest);break;}}}
    if(!res&&allowPartial){const sub=s.slice(i);if(sub.length<=6&&SYL.some(x=>x.startsWith(sub)))res=[sub];}
    memo.set(i,res);return res;}
  return f(0);
}
function learnScore(w){return S.learn[w]||0;}
function getCands(b){
  const out=[],seen=new Set();
  const add=(w,used,py)=>{if(seen.has(w))return;seen.add(w);out.push({w,used});};
  const sg=segment(b);
  const clean=b.replace(/'/g,'');
  if(sg&&sg.length){
    const lastFull=SYLSET.has(sg[sg.length-1]);
    // full words
    if(sg.length>=2){
      const key=sg.join("'");
      if(lastFull&&WD.has(key))sortL(WD.get(key)).forEach(w=>add(w,b.length));
      // prefix (last partial)
      if(!lastFull||true){const pre=sg.slice(0,-1).join("'")+"'"+sg[sg.length-1];let n=0;
        for(const [k,v] of WD){if(n>12)break;if(k.startsWith(pre)&&k.split("'").length===sg.length){v.forEach(w=>{if(n<=12){add(w,b.length);n++;}});}}}
      // shorter words from the front
      for(let n=sg.length-1;n>=2;n--){const k=sg.slice(0,n).join("'");if(WD.has(k)){const used=consumed(b,n);sortL(WD.get(k)).forEach(w=>add(w,used));}}
    }
    // initials abbreviations (e.g. nh -> 你好)
    if(clean.length>=2&&clean.length<=5&&!/[aeiouv]/.test(clean.slice(1))){const a=INI.get(clean);if(a)sortL(a.map(x=>x[0])).slice(0,20).forEach(w=>add(w,b.length));}
    // single chars of first syllable
    const s0=sg[0];const used0=consumed(b,1);
    if(SYLSET.has(s0)){sortL(CH.get(s0)).forEach(c=>add(c,used0));}
    else{const arr=[];SYL.forEach(sy=>{if(sy.startsWith(s0))CH.get(sy).forEach((c,i)=>arr.push([c,i]));});arr.sort((a,b)=>a[1]-b[1]);sortL(arr.map(x=>x[0])).slice(0,60).forEach(c=>add(c,used0));}
  }else{
    const a=INI.get(clean);if(a)sortL(a.map(x=>x[0])).slice(0,20).forEach(w=>add(w,b.length));
  }
  return out;
}
function sortL(arr){if(!arr.some(w=>S.learn[w]))return arr;return arr.map((w,i)=>[w,i]).sort((a,b)=>(learnScore(b[0])-learnScore(a[0]))||(a[1]-b[1])).map(x=>x[0]);}
function consumed(b,n){ // number of chars of b covering first n syllables
  let cnt=0,i=0;const sg=segment(b);const tgt=sg.slice(0,n).join('').length;
  while(i<b.length&&cnt<tgt){if(b[i]!=="'")cnt++;i++;}while(b[i]==="'")i++;return i;}
function updIME(){
  if(!buf){ibox.style.display='none';cands=[];return;}
  cands=getCands(buf);ibox.style.display='block';drawCands();
}
function drawCands(){
  ibuf.textContent=(segment(buf)||[buf]).join("'");
  const pg=cands.slice(cpage*9,cpage*9+9);
  ilist.innerHTML=pg.length?pg.map((c,i)=>`<span class="cand${i===0?' f':''}" data-i="${cpage*9+i}"><small>${i+1}</small>${c.w}</span>`).join('')+(cands.length>9?`<span style="align-self:center;color:#b0a690;font-size:12px;padding:0 6px">${cpage+1}/${Math.ceil(cands.length/9)}</span>`:''):'<span style="color:#aaa;font-size:13px;padding:4px">Không có chữ phù hợp – Enter để giữ chữ cái</span>';
  // position
  const s=getSelection();let r=null;if(s.rangeCount){const rr=s.getRangeAt(0).cloneRange();rr.collapse(false);const rects=rr.getClientRects();r=rects[0];}
  if(!r)r=ed.getBoundingClientRect();
  const z=editing?editing.z:40;
  let left=r.left,top=(r.bottom||r.top+z)+8;ibox.style.left=Math.max(8,Math.min(left,innerWidth-ibox.offsetWidth-8))+'px';
  if(top+80>innerHeight)top=(r.top||0)-ibox.offsetHeight-10-z;ibox.style.top=top+'px';
}

    const k2=Math.min(1,(W*.6)/w,(Hh*.6)/h);const dw=w*k2,dh=h*k2;

}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
function exportJSON(){const d=new Date();const n=`bang-trang-sao-luu-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;dl(new Blob([JSON.stringify({pages:D.pages,cur:D.cur,v:1})],{type:'application/json'}),n);toast('Đã xuất file sao lưu');}
$('#fimp').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.pages)throw 0;if(!confirm(`Nhập ${d.pages.length} trang từ file sao lưu? Nội dung hiện tại sẽ bị thay thế.`))return;D={pages:d.pages,cur:0};D.pages.forEach(p=>{p.id=p.id||uid();});sel.clear();render();buildBar();save(true);showHelp(false);toast('Đã nhập sao lưu');}catch(err){alert('File không hợp lệ');}};fr.readAsText(f);e.target.value='';};

/* ---------- help panel ---------- */
function boardURL(){return location.href.split('?')[0].split('#')[0];}
function bookmarklet(){
  const u=boardURL();
  return "javascript:(function(){var u='"+u+"',d=document,f=d.getElementById('gy-wb');if(f){var s=f.style.display=='none';f.style.display=s?'block':'none';if(s){try{f.contentWindow.focus()}catch(e){}}return}f=d.createElement('iframe');f.id='gy-wb';f.src=u+'?overlay=1';f.setAttribute('allow','clipboard-read; clipboard-write; fullscreen');f.style.cssText='position:fixed;top:0;left:0;width:100vw;height:100vh;border:0;margin:0;padding:0;z-index:2147483647;background:#fbf7ee;display:block';(d.body||d.documentElement).appendChild(f);f.onload=function(){try{f.contentWindow.focus()}catch(e){}};if(!window.__gywb){window.__gywb=1;window.addEventListener('message',function(e){if(e.data==='gy-wb-close'){var g=d.getElementById('gy-wb');if(g)g.style.display='none';try{window.focus()}catch(x){}}})}})();";
}
function showHelp(on){
  if(on===false){$('#help').classList.remove('show');return;}
  const K=(...k)=>k.map(x=>`<kbd>${x}</kbd>`).join(' ');
  const rows=[
    [K('P'),'Bút viết'],[K('H'),'Bút highlight (dạ quang)'],[K('E'),'Tẩy (đầu tẩy của bút vẽ cũng tẩy được)'],[K('L'),'Bút laser – chỉ trỏ, tự mờ'],
    [K('T'),'Gõ chữ Hán (bấm lên bảng rồi gõ pinyin)'],[K('G'),'Chèn ô chữ – kéo ngang để ra 1 hàng ô; bấm G lần nữa đổi 田/米'],[K('V'),'Chọn, kéo di chuyển; kéo ô vuông ở góc để phóng to/thu nhỏ'],
    [K('1','–','6'),'Đổi màu bút (khi dùng highlight: 1–4)'],[K('[',']'),'Nhỏ / to nét bút, cỡ chữ, cỡ ô'],[K('Y'),'Hiện / ẩn pinyin (đang chọn chữ thì chỉ đổi chữ đó)'],
    [K('K'),'Đổi font chữ Hán 楷 → 黑 → 宋'],[K('B'),'Đổi nền: cổ phong → trắng → ô 田字格'],[K('Shift')+' + kéo','Kẻ đường thẳng'],
    [K(CMD,'Z'),'Hoàn tác'],[K('⇧',CMD,'Z'),'Làm lại'],[K(CMD,'V'),'Dán ảnh chụp màn hình lên bảng'],
    [K('Delete'),'Xoá đối tượng đang chọn'],[K(CMD,'A'),'Chọn tất cả'],[K('PageUp')+' '+K('PageDown')+' / '+K('←')+K('→'),'Chuyển trang'],
    [K('N'),'Thêm trang mới'],[K('Tab'),'Ẩn / hiện thanh công cụ'],[K('A'),'Bật/tắt tự ẩn thanh công cụ (đưa chuột lên mép trên để hiện)'],[K(CMD,'S'),'Lưu trang thành ảnh PNG'],
    [K('Esc'),OVERLAY?'Đóng bảng, quay lại trang web':'Bỏ chọn'],[K('?'),'Mở bảng này']
  ];
  const ime=[[K('a–z'),'Gõ pinyin không dấu, vd. nihao, xuesheng; gõ tắt chữ cái đầu: nh → 你好'],[K('Space')+' '+K('1–9'),'Chọn chữ'],[K('-')+' '+K('='),'Lật trang gợi ý'],[K('Shift'),'Đổi 中 / 英 (gõ tiếng Việt/Anh)'],[K('Enter'),'Xuống dòng (đang gõ dở thì giữ nguyên chữ cái)'],[K(CMD,'Enter')+' / '+K('Esc'),'Xong, đặt chữ lên bảng'],[K('Shift')+' + nhấp đúp','(công cụ V) sửa pinyin đa âm']];
  const g=a=>'<div class="grid">'+a.map(([k,v])=>`<div>${k}<span>${v}</span></div>`).join('')+'</div>';
  $('#hp').innerHTML=`<h2>Bảng trắng Guangyu Hanyu – phím tắt</h2><div style="font-size:13px;color:#8a8172">Bảng tự lưu sau mỗi nét viết. Mọi phím tắt dùng khi chưa bấm vào ô gõ chữ.</div>
  <h3>Công cụ</h3>${g(rows)}<h3>Bộ gõ Hán tự (công cụ T)</h3>${g(ime)}
  <h3>Mở nhanh bảng đè lên trang web đang chiếu (Safari)</h3>
  <ol><li>Bật thanh Mục ưa thích: menu <b>Hiển thị → Hiển thị thanh Mục ưa thích</b> (${K('⇧',CMD,'B')}).</li>
  <li>Kéo nút đỏ bên dưới thả lên thanh Mục ưa thích, đặt ở <b>vị trí đầu tiên</b>.<br><a id="bm" href="#">✎ Bảng trắng</a></li>
  <li>Nếu Safari không cho kéo: bấm <b>Sao chép mã</b>, đánh dấu một trang bất kỳ vào Mục ưa thích, rồi chuột phải vào dấu trang → <b>Sửa địa chỉ</b> → dán mã vào.</li>
  <li>Phím tắt: Safari → Cài đặt → <b>Tab</b> → bỏ chọn “Dùng ⌘-1 đến ⌘-9 để chuyển tab”. Từ đó bấm ${K(CMD,'1')} là bảng hiện lên, bấm lại ${K(CMD,'1')} (hoặc ${K('Esc')}, nút ✕) để ẩn.</li></ol>
  <textarea id="bmcode" readonly></textarea>
  <div class="row"><button class="btn red" id="bcopy">Sao chép mã</button></div>
  <h3>Lưu trữ</h3><p style="margin:0 0 6px">Nên <b>Xuất sao lưu</b> định kỳ (Safari có thể tự xoá dữ liệu của trang không được mở trong 7 ngày).</p>
  <div class="row"><button class="btn" id="bexp">⤓ Xuất sao lưu (.json)</button><button class="btn" id="bimp">⤒ Nhập sao lưu</button><button class="btn" id="bpng">🖼 Lưu trang thành ảnh</button><button class="btn" id="bdel">🗑 Xoá trang này</button>${OVERLAY?'':'<button class="btn" id="bfs">⛶ Toàn màn hình (F)</button>'}</div>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn red" id="bclose">Đóng</button></div>`;
  const code=bookmarklet();$('#bm').setAttribute('href',code);$('#bm').onclick=e=>{e.preventDefault();toast('Kéo nút này lên thanh Mục ưa thích');};$('#bmcode').value=code;
  $('#bcopy').onclick=()=>{const t=$('#bmcode');t.select();try{navigator.clipboard.writeText(code).then(()=>toast('Đã sao chép mã'),()=>{document.execCommand('copy');toast('Đã sao chép mã');});}catch(e){document.execCommand('copy');toast('Đã sao chép mã');}};
  $('#bexp').onclick=exportJSON;$('#bimp').onclick=()=>$('#fimp').click();$('#bpng').onclick=()=>{showHelp(false);setTimeout(exportPNG,50);};$('#bdel').onclick=()=>{showHelp(false);delPage();};
  if($('#bfs'))$('#bfs').onclick=()=>{showHelp(false);toggleFS();};
  $('#bclose').onclick=()=>showHelp(false);$('#help').classList.add('show');
}
$('#help').addEventListener('pointerdown',e=>{if(e.target.id==='help')showHelp(false);});
function toggleFS(){const d=document,el=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}else{(el.requestFullscreen||el.webkitRequestFullscreen).call(el);}}

/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{
  if(editing)return;
  const helpOpen=$('#help').classList.contains('show');
  if(helpOpen){if(e.key==='Escape'||e.key==='?'){e.preventDefault();showHelp(false);}return;}
  const mod=e.metaKey||e.ctrlKey,c=e.code,k=e.key;
  if(mod){
    if(c==='KeyZ'){e.preventDefault();e.shiftKey?redo():undo();}
    else if(c==='KeyY'){e.preventDefault();redo();}
    else if(c==='KeyS'){e.preventDefault();exportPNG();}
    else if(c==='KeyA'){e.preventDefault();setTool('sel');page().objs.forEach(o=>sel.add(o.id));render();}
    else if(c==='Enter'){e.preventDefault();}
    return;
  }
  if(e.altKey)return;
  const map={KeyP:'pen',KeyH:'hl',KeyE:'er',KeyL:'laser',KeyT:'tx',KeyV:'sel'};
  if(map[c]){e.preventDefault();setTool(map[c]);flashBar();return;}
  if(c==='KeyG'){e.preventDefault();if(S.tool==='gr'){S.gk=S.gk==='tian'?'mi':'tian';toast(S.gk==='mi'?'Ô 米字格':'Ô 田字格');}setTool('gr');return;}
  if(c==='KeyB'){e.preventDefault();cycleBg();return;}
  if(c==='KeyY'){e.preventDefault();togglePy();return;}
  if(c==='KeyK'){e.preventDefault();cycleFont();return;}
  if(c==='KeyN'){e.preventDefault();addPage();return;}
  if(c==='KeyF'&&!OVERLAY){e.preventDefault();toggleFS();return;}
  if(/^Digit[1-9]$/.test(c)){e.preventDefault();setColor(+c.slice(5)-1);flashBar();return;}
  if(c==='BracketLeft'){e.preventDefault();cycleSize(-1);return;}
  if(c==='BracketRight'){e.preventDefault();cycleSize(1);return;}
  if(c==='KeyA'){e.preventDefault();toggleAH();return;}
  if(k==='Tab'){e.preventDefault();S.bar=!S.bar;buildBar();save();return;}
  if(k==='?'||(c==='Slash'&&e.shiftKey)){e.preventDefault();showHelp(true);return;}
  if(k==='PageDown'){e.preventDefault();goPage(D.cur+1);return;}
  if(k==='PageUp'){e.preventDefault();goPage(D.cur-1);return;}
  if(k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown'){
    e.preventDefault();
    if(sel.size){const s=e.shiftKey?10:2;const dx=k==='ArrowLeft'?-s:k==='ArrowRight'?s:0,dy=k==='ArrowUp'?-s:k==='ArrowDown'?s:0;commit(page().objs.map(o=>sel.has(o.id)?moveObj(o,dx,dy):o));}
    else if(k==='ArrowLeft')goPage(D.cur-1);else if(k==='ArrowRight')goPage(D.cur+1);
    return;}
  if(k==='Delete'||k==='Backspace'){e.preventDefault();if(sel.size){commit(page().objs.filter(o=>!sel.has(o.id)));sel.clear();render();}else if(e.shiftKey)delPage();return;}
  if(k==='Enter'&&S.tool==='sel'&&sel.size===1){const o=selObjs()[0];if(o.t==='x'){e.preventDefault();openEditor(o);}return;}
  if(k==='Escape'){e.preventDefault();if(sel.size){sel.clear();render();}else if(OVERLAY)closeBoard();return;}
});
// keep keyboard focus inside board when shown in overlay

/* ---------- init ---------- */
load().then(()=>{resize();buildBar();setTool(S.tool==='tx'?'pen':S.tool);setSaved('ok');if(!localStorageGet('gy-seen')){localStorageSet('gy-seen','1');setTimeout(()=>toast('Bấm ? để xem phím tắt'),600);}try{window.focus();}catch(e){}});
function localStorageGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function localStorageSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
window.__wb={get D(){return D},get S(){return S},getCands,segment,render};
})();
</script>
